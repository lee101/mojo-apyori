[project]
name = "mojo-apyori"
version = "0.1.0"
description = "A Mojo-accelerated drop-in port of apyori itemset mining"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "apriori", "association-rules", "data-mining"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "apyori==1.1.2"]

[project.scripts]
apyori-run = "apyori:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
